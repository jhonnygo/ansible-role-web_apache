---
- name: systemd daemon-reload
  listen: systemd daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
  changed_when: false

- name: validate apache config
  listen: apache config changed
  ansible.builtin.command: apache2ctl -t
  register: _apache_validate
  changed_when: false
  failed_when: _apache_validate.rc != 0
  when: "'apache2' in ansible_facts.packages"

- name: reload apache
  listen: apache config changed
  ansible.builtin.systemd:
    name: apache2
    state: reloaded
  when:
    - "'apache2' in ansible_facts.packages"
    - not ansible_check_mode

- name: restart apache
  listen: restart apache
  ansible.builtin.systemd:
    name: apache2
    state: restarted
  when: "'apache2' in ansible_facts.packages"

- name: start apache
  listen: start apache
  ansible.builtin.systemd:
    name: apache2
    state: started
  when: "'apache2' in ansible_facts.packages"

- name: stop apache
  listen: stop apache
  ansible.builtin.systemd:
    name: apache2
    state: stopped
  when: "'apache2' in ansible_facts.packages"
