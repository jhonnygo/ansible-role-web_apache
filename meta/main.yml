# meta/main.yml
galaxy_info:
  role_name: web_apache
  author: Jhonny Alexander (JhonnyGO) - <soporte@Jhoncytech.com>
  description: >
    Idempotent role to install and configure Apache2 on Debian/Ubuntu with declarative VirtualHosts.
    Creates docroots and optional index.php, renders vhosts from Jinja2, manages default/catch-all sites,
    enables/disables with a2ensite/a2dissite, and optionally purges unmanaged vhosts.
  license: MIT
  min_ansible_version: "2.13"

  platforms:
    - name: Ubuntu
      versions: ["focal", "jammy"]
    - name: Debian
      versions: ["bullseye", "bookworm"]

  galaxy_tags:
    - apache
    - httpd
    - webserver
    - vhost
    - linux
    - debian
    - ubuntu
    - devops
    - ansible-role
    - molecule

dependencies: []
