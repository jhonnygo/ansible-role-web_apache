# meta/main.yml
galaxy_info:
  role_name: web_apache
  author: Jhonny Alexander (JhonnyGO) - <soporte@Jhoncytech.com>
  description: >
    Install and harden Apache on Debian/Ubuntu: manage vhosts, default sites (HTTP/SSL), optional catch-all, and safely purge unmanaged configs.
  license: MIT
  min_ansible_version: "2.13"

  platforms:
    - name: Ubuntu
      versions: ["focal", "jammy"]
    - name: Debian
      versions: ["bullseye", "bookworm"]

  galaxy_tags:
    - apache
    - httpd
    - webserver
    - vhost
    - linux
    - debian
    - ubuntu
    - devops
    - ansible-role
    - molecule

dependencies: []
