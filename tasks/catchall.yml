---
- name: Ensure catch-all docroot directory
  ansible.builtin.file:
    path: "{{ web_apache_catch_all_docroot }}"
    state: directory
    mode: "0755"

- name: Render catch-all vhost
  ansible.builtin.template:
    src: "catchall.conf.j2"
    dest: "/etc/apache2/sites-available/{{ web_apache_catch_all_filename }}"
    mode: "0644"
  notify: apache config changed

- name: Enable catch-all site
  ansible.builtin.command: "a2ensite {{ web_apache_catch_all_filename }}"
  args:
    creates: "/etc/apache2/sites-enabled/{{ web_apache_catch_all_filename }}"
  notify: apache config changed
